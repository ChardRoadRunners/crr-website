# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms@0.205.1/schema/sveltia-cms.json
# Sveltia CMS — Chard Road Runners
#
# ---------------------------------------------------------------------------
# THIS FILE MIRRORS src/content.config.ts. THEY MUST NOT DRIFT.
#
# The same content is described in two places: the Zod schema Astro validates
# against at build time, and the form fields below. If they disagree, the CMS
# happily accepts a post that the build then rejects — and that failure lands
# on whoever wrote the post, who is the least equipped to fix it.
#
# A change to one schema is a change to both, in the same commit.
# ---------------------------------------------------------------------------

# Shown on the sign-in screen and in the CMS header. The option is `logo.src`
# — `logo_url` is the deprecated form, and `logo_src` is not an option at all,
# so it would be ignored silently.
#
# This has to be a URL rather than an inlined file, which is why the copy in
# public/ has its colours baked in instead of using currentColor. That copy
# carries its own prefers-color-scheme rule, so it suits Sveltia's light and
# dark themes without needing two files.
#
# Sveltia also reuses this as the CMS tab's favicon, where its own docs note a
# square image works best. This one is roughly 2:1. Point src at /favicon.svg
# instead if the squashed tab icon annoys you more than a cramped sign-in logo.
logo:
  src: /crr-logo-lockup.svg

backend:
  name: github
  repo: Smellyllama/crr-website
  branch: main
  # These are what the History panel in the entry editor lists, so they are
  # read by committee members, not just in Git. Set explicitly rather than
  # left to Sveltia's defaults, so a version bump cannot quietly restyle the
  # history of a site nobody is watching that closely.
  #
  # Only {{slug}}, {{collection}}, {{path}} and the {{author-*}} fields exist —
  # there is no placeholder for an entry's own fields, so the title cannot
  # appear here. Author is deliberately left out: the History panel already
  # shows the name and avatar, and Git records the author separately, so
  # putting it in the text repeats it twice over.
  #
  # {{collection}} uses the collection's label_singular, which is why every
  # collection needs one.
  commit_messages:
    create: 'Add {{collection}} “{{slug}}”'
    update: 'Update {{collection}} “{{slug}}”'
    delete: 'Delete {{collection}} “{{slug}}”'
    uploadMedia: 'Add photo “{{path}}”'
    deleteMedia: 'Remove photo “{{path}}”'
  # GitHub OAuth proxy Worker, deployed separately from the site.
  # Source: crr-cms-auth/ in the project folder.
  base_url: https://crr-cms-auth.buddygoestravelling.workers.dev

# Simple publishing: Save commits straight to main and Cloudflare rebuilds.
# Editorial workflow is deliberately NOT enabled — it routes every post
# through a pull request needing approval, which is friction nobody needs yet.

output:
  # Leave optional fields out of the file entirely when they are empty,
  # instead of writing `posted: ''` or `distance: {value: null, unit: null}`.
  # Astro reads those as the wrong type and fails the build, whereas an
  # absent key is exactly what `.optional()` and `.default()` expect.
  # This one option prevents most schema-drift build failures.
  omit_empty_optional_fields: true

# Fallback only. Every collection below sets its own media folder, because
# Astro resolves image paths relative to the Markdown file that uses them.
media_folder: public/uploads
public_folder: /uploads

media_libraries:
  default:
    config:
      # Rename uploads to a clean slug: "Baltonsborough 5Mile.jpg" is saved as
      # "baltonsborough-5mile.jpg". Sveltia keeps the original name by default,
      # which puts spaces and capitals into URLs and Git paths. Applies to new
      # uploads only — files already committed keep their names.
      slugify_filename: true

      # Shrink photos in the browser before they are committed.
      #
      # This matters more here than on most sites because astro.config.mjs uses
      # passthroughImageService: Cloudflare's builder cannot run Sharp, so Astro
      # does no resizing or format conversion and serves whatever is committed,
      # at full size. A 2.9MB phone photo reached visitors as 2.9MB, and the race
      # reports index was loading 14MB of images for cards shown about 480px wide.
      #
      # Doing it here sidesteps that entirely — the work happens in the editor's
      # browser at upload time, so it does not depend on the build environment.
      #
      # raster_image covers jpeg, png and the rest in one entry. 1600px is about
      # twice the widest the site ever displays an image (the race report hero,
      # in a 768px container), so it still looks right on a retina phone.
      #
      # New uploads only. The 18MB already committed needs a separate pass.
      transformations:
        raster_image:
          format: webp
          quality: 85
          width: 1600

collections:
  # =========================================================================
  # RACE REPORTS
  # =========================================================================
  - name: race-reports
    label: Race reports
    label_singular: Race report
    description: >-
      Reports from races members have run, plus club news, Couch to 5k updates
      and social posts. There is no Delete button — a mistake is fixed by
      editing the report, and anything that genuinely needs removing goes
      through whoever looks after the website.
    folder: src/content/race-reports
    create: true
    # DELETION IS DISABLED ON PURPOSE — do not set this to true.
    #
    # media_folder below is entry-relative, so Sveltia treats the whole of
    # src/content/race-reports/images/ as this entry's asset folder. Deleting
    # one report therefore deletes every photo belonging to every report:
    # commit 13784bc took all 23, restored in 7fb8f5b. The post that triggered
    # it referenced a single image, and that one belonged to another post.
    #
    # Until the media layout is reworked, deleting a report is a Git job.
    delete: false
    # Produces 2026-08-01-shaves-cross-mini-marathon.md — the first race's
    # date plus the title, so nobody has to name a file by hand.
    slug: "{{races.0.raceDate | date('YYYY-MM-DD')}}-{{slug}}"
    # Photos sit in src/content/race-reports/images/ and are referenced as
    # ./images/name.jpg. media_folder = where the uploaded file is written
    # (relative to the post); public_folder = the path written into the
    # frontmatter, which is what Astro resolves.
    media_folder: images
    public_folder: ./images
    summary: "{{title}}"
    sortable_fields: [title]
    fields:
      - label: Title
        name: title
        widget: string
        hint: The headline of the report, as it will appear on the website.

      - label: Races covered
        name: races
        widget: list
        min: 1
        label_singular: Race
        summary: "{{fields.name}}"
        hint: >-
          One entry per race. A weekend round-up covering three races gets
          three entries. Put the earliest race first — its date orders the
          report on the site and names the file.
        fields:
          - label: Race name
            name: name
            widget: string
            hint: As it is normally called, for example "Chard Flyer 10k".

          # Optional objects render as an "Add Distance" tickbox. Unticked,
          # these subfield keys do not exist at all, so they are neither
          # validated nor written — which is what a timed event needs.
          # Ticked, the subfields are populated with their defaults and are
          # both required, so a distance can never be saved half-filled.
          - label: Distance
            name: distance
            widget: object
            required: false
            collapsed: false
            hint: >-
              Leave "Add Distance" unticked for timed events — a 12-hour, a
              lapped ultra — that have no fixed distance. Tick it and both
              boxes have to be filled in.
            fields:
              - label: How far
                name: value
                widget: number
                value_type: float
                # step drives the mobile keypad, not just the arrow buttons.
                # Sveltia counts the decimal places in step and sets
                # inputmode="decimal" when there is at least one, "numeric"
                # otherwise. step defaults to 1, which gave a phone keypad with
                # no decimal point at all — 13.1 and 26.2 could not be typed.
                # Desktop was unaffected, the field being a text input.
                #
                # 0.01 rather than 0.1 so the arrow buttons, which round to the
                # step's decimal places, cannot quietly turn a two-decimal trail
                # distance like 6.55 into 6.6. Typing is not limited by step.
                step: 0.01
                hint: Just the number — 10 for a 10k, 13.1 for a half marathon.
              - label: Miles or kilometres
                name: unit
                widget: select
                # Pre-filled so the units can never be left empty. Most club
                # races are in km; a mile race means changing it, which is
                # visible in the form.
                default: km
                options:
                  - { label: Kilometres (km), value: km }
                  - { label: Miles (mi), value: mi }

          - label: Race date
            name: raceDate
            widget: datetime
            format: "YYYY-MM-DD"
            date_format: "DD/MM/YYYY"
            time_format: false
            hint: The day the race was run — not the day you are writing this.

      - label: Race date is approximate
        name: dateApproximate
        widget: boolean
        required: false
        default: false
        hint: >-
          Tick this if the race date above is a best guess rather than
          confirmed — common on older reports rescued from the archive. The
          site then shows only the month and year, so it never states a day
          that might be wrong.

      - label: Date written
        name: posted
        widget: datetime
        required: false
        format: "YYYY-MM-DD"
        date_format: "DD/MM/YYYY"
        time_format: false
        hint: >-
          Optional. Shown on the report as the date it was written. It is
          never used to order posts — the race date does that.

      - label: Author
        name: author
        widget: string
        required: false
        hint: Optional. Leave empty if the report has no byline.

      - label: Category
        name: category
        widget: select
        required: false
        default: Race Report
        options:
          - Race Report
          - Club News
          - Couch to 5k
          - Social

      - label: One of our own races
        name: clubRace
        widget: boolean
        required: false
        default: false
        hint: >-
          Tick only for the Chard Flyer and the Forde Abbey 10k — the two
          races the club puts on itself. It adds a "Club race" badge.

      - label: Main photo
        name: heroImage
        widget: image
        required: false
        choose_url: false
        hint: >-
          The photo at the top of the report and on the race reports list.
          Optional — reports without a photo still look fine.

      # INTENTIONAL MISMATCH — do not "fix" this to match Astro.
      #
      # `required: false` here does not mean alt text is optional. Alt text is
      # required whenever a photo is set, enforced by the preSave hook in
      # index.html. It cannot be enforced by `required: true`, because Sveltia
      # has no conditional validation and would then demand a description on
      # the seven posts that have no photo at all.
      #
      # src/content.config.ts keeps heroImageAlt optional so those archive
      # posts still build. The CMS is deliberately stricter than the schema:
      # new content gets alt text, old content is left alone.
      - label: Main photo description
        name: heroImageAlt
        widget: string
        required: false
        hint: >-
          Describes the photo for people using a screen reader, and shows if
          the image fails to load. Name the runners if you know who they are.
          Required whenever there is a photo.

      # Matches heroImagePosition in src/content.config.ts. Only affects the
      # preview card on Facebook and WhatsApp, never the page itself.
      - label: Share card crop
        name: heroImagePosition
        widget: select
        required: false
        default: centre
        options:
          - { label: "Middle of the photo", value: centre }
          - { label: "Top of the photo", value: top }
          - { label: "Bottom of the photo", value: bottom }
        hint: >-
          When someone shares this post, the photo is cut to a wide strip. Tall
          photos lose about two thirds of their height, so pick the part with
          the faces in it. Middle suits most photos; use Top if heads are being
          cut off.

      - label: More photos
        name: images
        widget: list
        required: false
        label_singular: Photo
        summary: "{{fields.alt}}"
        hint: Any other photos to show further down the report.
        fields:
          - label: Photo
            name: src
            widget: image
            choose_url: false
          - label: Photo description
            name: alt
            widget: string
            hint: >-
              Needed for every photo — it is what a screen reader announces.
              Describe what is happening, and name the runners if you know them.

      - label: Summary
        name: excerpt
        widget: text
        hint: >-
          One or two sentences. It appears on the race reports listing page, in
          search results, in the ready-to-paste block at the foot of the post,
          and it is the sentence Facebook shows when somebody shares the report
          - Facebook takes it from the page and ignores anything typed into the
          share box. It does a lot of work, so make it read well on its own.

      - label: Draft — hide from the website
        name: draft
        widget: boolean
        required: false
        default: false
        hint: >-
          While this is ticked the report is saved but does not appear on the
          live site. Untick it when you are ready for people to see it.

      - label: The report
        name: body
        widget: markdown

  # =========================================================================
  # OUR RACES
  # =========================================================================
  - name: races
    label: Our races
    label_singular: Race
    description: >-
      The races the club puts on. Editing these updates the Our Races pages —
      dates, entry links and race day details. There is no Delete button — a
      mistake is fixed by editing the race, and anything that genuinely needs
      removing goes through whoever looks after the website.
    folder: src/content/races
    create: true
    # Same entry-relative media trap as race-reports above — deleting either
    # race would take every photo in src/content/races/images/ with it.
    # Deleting a race is a Git job until that is reworked.
    delete: false
    slug: "{{fields.slug}}"
    media_folder: images
    public_folder: ./images
    summary: "{{title}}"
    sortable_fields: [order, title]
    fields:
      - label: Race name
        name: title
        widget: string

      - label: Web address name
        name: slug
        widget: string
        pattern:
          - "^[a-z0-9]+(-[a-z0-9]+)*$"
          - "Lower-case letters, numbers and hyphens only — for example chard-flyer"
        hint: >-
          The last part of the page's web address: "chard-flyer" gives
          /our-races/chard-flyer. Lower-case letters, numbers and hyphens
          only. Avoid changing it once the page is live, or existing links
          to it will break.

      - label: Distance
        name: distance
        widget: object
        collapsed: false
        fields:
          - label: How far
            name: value
            widget: number
            value_type: float
            # See the note on the same field in race-reports above: without
            # this the phone keypad has no decimal point.
            step: 0.01
            hint: Just the number — 10 for a 10k, 13.1 for a half marathon.
          - label: Miles or kilometres
            name: unit
            widget: select
            default: km
            options:
              - { label: Kilometres (km), value: km }
              - { label: Miles (mi), value: mi }

      - label: Next race date
        name: nextDate
        widget: datetime
        required: false
        format: "YYYY-MM-DD"
        date_format: "DD/MM/YYYY"
        time_format: false
        hint: >-
          Leave empty if next year's date is not confirmed. The page still
          works without it — better an empty date than a wrong one.

      - label: Start time
        name: startTime
        widget: datetime
        required: false
        format: "HH:mm:ss"
        date_format: false
        time_format: "HH:mm"

      - label: Venue
        name: venue
        widget: string
        required: false
        hint: Where the race starts and finishes, for example "Chard Cricket Club".

      - label: Entries are open
        name: entriesOpen
        widget: boolean
        required: false
        default: false
        hint: >-
          The entry link below only appears on the site while this is ticked.
          Untick it once entries close, so a dead link is not left sitting on
          the page for the rest of the year.

      - label: Entry link
        name: entryUrl
        widget: string
        required: false
        pattern:
          - "^https?://.+"
          - "Enter a full web address starting with https://"
        hint: Full web address of the entry page, starting with https://.

      - label: Series
        name: series
        widget: string
        required: false
        hint: For example "Somerset Series". Leave empty if the race is not in one.

      - label: Series note
        name: seriesNote
        widget: string
        required: false

      - label: There is a junior race
        name: juniorRace
        widget: boolean
        required: false
        default: false

      - label: Junior race note
        name: juniorRaceNote
        widget: string
        required: false
        hint: Distance, age groups, start time — whatever parents need to know.

      - label: Race director
        name: raceDirector
        widget: string
        required: false

      - label: Race email
        name: contactEmail
        widget: string
        required: false
        hint: >-
          Where entrants ask about this race - parking, road closures, whether
          the junior race is on. Use the race's own club address rather than
          the director's own, so it survives them handing the job on.
        # Single-quoted so the backslashes stay literal, as on the welfare page.
        pattern:
          - '^[^@\s]+@[^@\s]+\.[^@\s]+$'
          - Enter a valid email address

      - label: Timing provider
        name: timing
        widget: string
        required: false

      - label: Results link
        name: resultsUrl
        widget: string
        required: false
        pattern:
          - "^https?://.+"
          - "Enter a full web address starting with https://"

      - label: Facebook event link
        name: facebookEventUrl
        widget: string
        required: false
        pattern:
          - "^https?://.+"
          - "Enter a full web address starting with https://"

      - label: Main photo
        name: heroImage
        widget: image
        required: false
        choose_url: false

      # Same intentional mismatch as race-reports above: optional here,
      # required whenever a photo is set, via the preSave hook in index.html.
      - label: Main photo description
        name: heroImageAlt
        widget: string
        required: false
        hint: >-
          Describes the photo for people using a screen reader. Required
          whenever there is a photo.

      - label: Order on the Our Races page
        name: order
        widget: number
        required: false
        default: 99
        value_type: int
        hint: Lower numbers come first. Leave it at 99 if you do not mind.

      - label: Race details
        name: body
        widget: markdown

  # =========================================================================
  # PAGES — fixed pages, one file each
  # =========================================================================
  - name: pages
    label: Pages
    # Without this, commit messages read "Update Pages “home”" — the plural
    # used as a singular. {{collection}} takes label_singular.
    label_singular: Page
    description: >-
      The wording on the main pages. The layouts are fixed; these are the
      words that go in them.
    files:
      - name: home
        label: Home page
        file: src/content/pages/home.md
        fields:
          # Tells the Astro schema which set of sections to expect. Not editable.
          - { name: page, widget: hidden, default: home }

          - label: Top of the page
            name: hero
            widget: object
            fields:
              - { label: Heading, name: heading, widget: string }
              - label: Strapline
                name: strapline
                widget: text
                hint: The line under the main heading.
              - label: Main button
                name: primaryCta
                widget: object
                fields:
                  - { label: Button text, name: label, widget: string }
                  - label: Button link
                    name: href
                    widget: string
                    hint: A path on this site like /join-us, or a full https:// address.
              - label: Second button
                name: secondaryCta
                widget: object
                fields:
                  - { label: Button text, name: label, widget: string }
                  - { label: Button link, name: href, widget: string }

          - label: Club nights
            name: clubNights
            widget: object
            fields:
              - { label: Heading, name: heading, widget: string }
              - label: Introduction
                name: intro
                widget: markdown
              - label: The nights
                name: nights
                widget: list
                min: 1
                label_singular: Night
                summary: "{{fields.day}}"
                fields:
                  - { label: Day, name: day, widget: string }
                  - label: Time
                    name: time
                    widget: string
                    hint: For example 7:00pm.
                  - { label: Venue, name: venue, widget: string }
                  - { label: Short summary, name: summary, widget: string }
                  - label: Detail
                    name: detail
                    widget: markdown
              - label: Reassurance
                name: reassurance
                widget: markdown

          - label: Handicap race
            name: handicap
            widget: object
            fields:
              - { label: Heading, name: heading, widget: string }
              - label: Body
                name: body
                widget: markdown

          - label: Couch to 5k
            name: couchTo5k
            widget: object
            fields:
              - { label: Heading, name: heading, widget: string }
              - label: Body
                name: body
                widget: markdown
              - label: Next course dates
                name: nextCourse
                widget: string
                required: false
                hint: >-
                  Leave empty until dates are confirmed. While it is empty the
                  page shows the message below instead, so it never displays a
                  blank or invented date.
              - label: Message when no dates are set
                name: emptyState
                widget: markdown
              - label: Button
                name: cta
                widget: object
                fields:
                  - { label: Button text, name: label, widget: string }
                  - { label: Button link, name: href, widget: string }

          - label: Latest race reports section
            name: latestReports
            widget: object
            fields:
              - { label: Heading, name: heading, widget: string }
              - { label: Link text, name: linkLabel, widget: string }
              - label: Message when there are no reports
                name: emptyState
                widget: markdown

          - label: Coming up section
            name: upcoming
            widget: object
            fields:
              - { label: Heading, name: heading, widget: string }
              - { label: Link text, name: linkLabel, widget: string }
              - label: Message when nothing is planned
                name: emptyState
                widget: markdown
              - label: Championship badge
                name: championshipLabel
                widget: string
                hint: >-
                  The label on a race that counts towards the championship.

          - label: Our races section
            name: ourRaces
            widget: object
            fields:
              - { label: Heading, name: heading, widget: string }
              - label: Introduction
                name: intro
                widget: markdown
              - { label: Link text, name: linkLabel, widget: string }

      - name: join-us
        label: Join us page
        file: src/content/pages/join-us.md
        fields:
          # Tells the Astro schema which set of sections to expect. Not editable.
          - { name: page, widget: hidden, default: join-us }

          - label: Top of the page
            name: hero
            widget: object
            fields:
              - { label: Heading, name: heading, widget: string }
              - { label: Strapline, name: strapline, widget: text }

          - label: Your first night
            name: firstVisit
            widget: object
            fields:
              - { label: Heading, name: heading, widget: string }
              - label: Introduction
                name: intro
                widget: markdown
                required: false
              - label: Steps
                name: steps
                widget: list
                min: 1
                label_singular: Step
                summary: "{{fields.label}}"
                fields:
                  - label: Label
                    name: label
                    widget: string
                    hint: For example When, Where, Parking.
                  - label: Detail
                    name: detail
                    widget: markdown
                    hint: >-
                      Line breaks are kept, so an address can go on several
                      lines. what3words references (///word.word.word) are fine.

                  - label: Map
                    name: map
                    widget: object
                    required: false
                    collapsed: true
                    hint: >-
                      Only the step that says where we meet needs this. The map
                      picture itself is a file in the repository, drawn from
                      OpenStreetMap - only the wording is editable here.
                    fields:
                      - label: Description of the location
                        name: alt
                        widget: text
                        hint: >-
                          Read aloud to anyone who cannot see the map, so
                          describe where the club is, not what the picture
                          looks like.
                      - label: Link text
                        name: linkLabel
                        widget: string
                      - label: Map link
                        name: url
                        widget: string
                        pattern:
                          - "^https?://.+"
                          - "Enter a full web address starting with https://"
                      - label: Map credit
                        name: credit
                        widget: string
                        hint: >-
                          Required by OpenStreetMap's licence, which is what
                          lets us use the map at all. Leave it as it is.

              - label: Reassurance
                name: reassurance
                widget: markdown

          - label: Which night
            name: whichNight
            widget: object
            fields:
              - { label: Heading, name: heading, widget: string }
              - label: Tuesday
                name: tuesday
                widget: markdown
                hint: Name the day in the text — the page adds no heading of its own.
              - label: Thursday
                name: thursday
                widget: markdown

          - label: Membership
            name: membership
            widget: object
            fields:
              - { label: Heading, name: heading, widget: string }
              - label: Introduction
                name: intro
                widget: markdown
                required: false
              - label: Membership options
                name: options
                widget: list
                min: 1
                label_singular: Option
                summary: "{{fields.name}} — {{fields.price}}"
                fields:
                  - { label: Name, name: name, widget: string }
                  - label: Price
                    name: price
                    widget: string
                    hint: Include the pound sign, for example £18.
                  - label: Detail
                    name: detail
                    widget: markdown
              - label: Renewal
                name: renewal
                widget: markdown
                required: false
              - label: How to pay
                name: howToPay
                widget: markdown
              - { label: Connect My Club code, name: connectMyClubCode, widget: string }
              - label: Membership form link
                name: formUrl
                widget: string
                required: false
                hint: >-
                  Leave empty until there is a form to point at. Nothing is
                  shown on the page while it is empty, so there is never a
                  dead link.
              - label: Membership email
                name: membershipEmail
                widget: string
                pattern:
                  - "^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$"
                  - Enter a valid email address

          - label: Couch to 5k
            name: couchTo5k
            widget: object
            fields:
              - { label: Heading, name: heading, widget: string }
              - label: Body
                name: body
                widget: markdown
              - label: Next course dates
                name: nextCourse
                widget: string
                required: false
                hint: Leave empty until dates are confirmed.
              - label: Message when no dates are set
                name: emptyState
                widget: markdown

          - label: Questions
            name: questions
            widget: object
            fields:
              - { label: Heading, name: heading, widget: string }
              - label: Body
                name: body
                widget: markdown

      - name: calendar
        label: Calendar page
        file: src/content/pages/calendar.md
        fields:
          - { name: page, widget: hidden, default: calendar }

          - label: Top of the page
            name: hero
            widget: object
            fields:
              - { label: Heading, name: heading, widget: string }
              - { label: Strapline, name: strapline, widget: text }

          - label: Search and sharing
            name: seo
            widget: object
            fields:
              - label: Description
                name: description
                widget: text
                hint: >-
                  One sentence, shown under the page title in search results
                  and when the page is shared.

          - label: Club nights
            name: clubNights
            widget: object
            hint: >-
              The nights themselves come from the club's Google calendar, not
              from here. This is the wording around them.
            fields:
              - { label: Heading, name: heading, widget: string }
              - { label: Introduction, name: intro, widget: text }
              - label: If there is nothing to show
                name: emptyState
                widget: text
                hint: >-
                  Shown when the calendar has no club nights in it. Write
                  something a visitor can actually use - they still want to
                  know when we meet.

          - label: Races coming up
            name: races
            widget: object
            hint: >-
              Read from the race, championship and club race calendars in
              Google. This is the wording around them.
            fields:
              - { label: Heading, name: heading, widget: string }
              - { label: Introduction, name: intro, widget: text }
              - label: If there is nothing to show
                name: emptyState
                widget: text

          - label: Championship badge
            name: championshipLabel
            widget: string
            hint: The label on a race that counts towards the championship.

          - label: Entry link wording
            name: entryLabel
            widget: string
            hint: >-
              The wording of the link to a race's own entry page, used wherever
              a race has one.

          - label: Race diary
            name: raceDiary
            widget: object
            hint: >-
              The diary below the calendar, worked out from past race reports.
              Wording only - the entries come from the race diary itself.
            fields:
              - { label: Heading, name: heading, widget: string }
              - { label: Introduction, name: intro, widget: text }

      - name: contact
        label: Contact page
        file: src/content/pages/contact.md
        fields:
          - { name: page, widget: hidden, default: contact }

          - label: Top of the page
            name: hero
            widget: object
            fields:
              - { label: Heading, name: heading, widget: string }
              - { label: Strapline, name: strapline, widget: text }

          - label: Introduction
            name: intro
            widget: markdown

          # ONLY the general address lives here. Membership, welfare and the two
          # races are shown on this page but owned elsewhere — the join us page,
          # the welfare page, and each race. Change one of those in its own place
          # and the contact page follows. There is deliberately no box for them
          # here: a second copy would go stale silently, and a stale welfare
          # address sends a safeguarding concern into a dead mailbox.
          - label: General enquiries
            name: general
            widget: object
            collapsed: false
            fields:
              - { label: Heading, name: label, widget: string }
              - label: What to use it for
                name: detail
                widget: markdown
              - label: Email
                name: email
                widget: string
                pattern:
                  - '^[^@\s]+@[^@\s]+\.[^@\s]+$'
                  - Enter a valid email address

          - label: Membership
            name: membership
            widget: object
            hint: >-
              Wording only. The address comes from the join us page.
            fields:
              - { label: Heading, name: label, widget: string }
              - label: What to use it for
                name: detail
                widget: markdown

          - label: Welfare
            name: welfare
            widget: object
            hint: >-
              Wording only. The address and the officer's name come from the
              welfare page.
            fields:
              - { label: Heading, name: label, widget: string }
              - label: What to use it for
                name: detail
                widget: markdown

          - label: Our races
            name: races
            widget: object
            hint: >-
              Wording only. Each race's address comes from the race itself,
              under Our Races.
            fields:
              - { label: Heading, name: label, widget: string }
              - label: What to use it for
                name: detail
                widget: markdown

          - label: Where we are
            name: whereWeAre
            widget: object
            hint: >-
              The map picture itself is not editable here - it is a file in the
              repository, drawn from OpenStreetMap. Everything else on this
              block is.
            fields:
              - { label: Heading, name: heading, widget: string }
              - label: Address
                name: address
                widget: text
                hint: >-
                  One line each. This is also on the join us page - if it
                  changes, change it in both places.
              - label: Description of the location
                name: mapAlt
                widget: text
                hint: >-
                  Read aloud to anyone who cannot see the map, so describe
                  where the club is, not what the picture looks like. Never
                  "a map of Chard".
              - label: Link text
                name: linkLabel
                widget: string
                hint: >-
                  The wording of the link under the map, for example "Open in
                  Google Maps".
              - label: Map link
                name: mapUrl
                widget: string
                pattern:
                  - "^https?://.+"
                  - "Enter a full web address starting with https://"
              - label: Map credit
                name: credit
                widget: string
                hint: >-
                  Required by OpenStreetMap's licence, which is what lets us
                  use the map at all. Leave it as it is.

          - label: The committee
            name: committee
            widget: object
            fields:
              - { label: Heading, name: heading, widget: string }
              - label: Names and roles
                name: body
                widget: markdown
                required: false
                hint: >-
                  Roles and names only - never anyone's personal email or
                  address. Nothing shows on the page while this starts with
                  TODO, so it is safe to leave until the committee has said who
                  is happy to be listed.

  # =========================================================================
  # LEGAL AND POLICY PAGES
  # =========================================================================
  - name: legal
    label: Policy pages
    label_singular: Policy page
    description: >-
      Welfare, inclusion, privacy, and the rules and constitution. Editing the
      words here changes the page. There is no Delete button, and no way to add
      a new one: a new policy page also needs a footer link adding in the code,
      so it is a job for whoever looks after the website.
    folder: src/content/legal
    # Mirrors the `legal` collection in src/content.config.ts.
    #
    # create is off because a new file here would get a working route but no
    # footer link, leaving a page nobody can find. delete is off for the same
    # reason it is off elsewhere — removal is a Git job.
    create: false
    delete: false
    summary: "{{title}}"
    sortable_fields: [title]
    fields:
      - label: Title
        name: title
        widget: string
        hint: The heading at the top of the page.

      - label: Introduction
        name: intro
        widget: text
        hint: >-
          The paragraph under the heading. Also used as the page's description
          in search results and when the page is shared, so make it read on its
          own.

      - label: Last updated
        name: lastUpdated
        widget: datetime
        required: false
        format: "YYYY-MM-DD"
        date_format: "DD/MM/YYYY"
        time_format: false
        hint: >-
          When the document itself was last changed. Leave empty if it does not
          apply — nothing is shown rather than a blank date.

      - label: Last reviewed
        name: lastReviewed
        widget: datetime
        required: false
        format: "YYYY-MM-DD"
        date_format: "DD/MM/YYYY"
        time_format: false
        hint: >-
          When the committee last checked the wording was still right, even if
          nothing changed.

      - label: Welfare officer
        name: welfareOfficer
        widget: object
        required: false
        collapsed: false
        hint: >-
          The welfare page only. Filling this in shows the name and a
          clickable email at the top of the page.
        fields:
          - { label: Name, name: name, widget: string }
          - label: Email
            name: email
            widget: string
            # Single-quoted: YAML treats backslashes literally here, so the
            # pattern needs no escaping. The double-quoted one above has to
            # write \\s for the same effect.
            pattern:
              - '^[^@\s]+@[^@\s]+\.[^@\s]+$'
              - Enter a valid email address

      - label: The page
        name: body
        widget: markdown
  # =========================================================================
  # RACE DIARY
  # =========================================================================
  - name: calendar-events
    label: Race diary
    label_singular: Race
    description: >-
      Races the club runs each year. Most entries say roughly when a race
      happens rather than giving a date, because the date came from one year's
      race report and annual races move. The page shows those as approximate on
      purpose. Only set Status to Confirmed when you have checked this year's
      date with the organiser.
    folder: src/content/calendar-events
    # Committee members should be able to add races they have run.
    create: true
    # Off to match the other collections, given the deletion cascade recorded
    # in docs/handover.md. Removing a race is a Git job.
    delete: false
    summary: "{{name}}"
    sortable_fields: [month, name, status]
    # No `default` on purpose. A default filter of retired=false would hide
    # every entry written before the field existed, because their files have no
    # `retired` key at all — the schema defaults it, the file does not carry it.
    # The list shows everything and these narrow it on request.
    view_filters:
      filters:
        - name: active
          label: Active
          field: status
          pattern: active
        - name: renamed
          label: Renamed
          field: status
          pattern: renamed
        - name: dormant
          label: Dormant
          field: status
          pattern: dormant
        - name: retired
          label: Retired
          field: status
          pattern: retired
    fields:
      - label: Race name
        name: name
        widget: string
        hint: >-
          Must match the race name used in race reports exactly, or the diary
          entry cannot list the reports about it. For example "Budleigh Blister".

      - label: Also known as
        name: aliases
        widget: list
        required: false
        field: { label: Name, name: name, widget: string }
        hint: >-
          Every other name this race goes by, or used to - spelled the way the
          old race reports spell it. "Bicton Blister 10" belongs on the Budleigh
          Blister; "Bridgwater 10k" and "Bridgwater Half Marathon" both belong
          on the one Bridgwater entry. This is what keeps those reports listed
          against the race. Do not edit the old reports themselves: they are
          somebody's account of a race that really was called that at the time.

      - label: Month
        name: month
        widget: number
        value_type: int
        min: 1
        max: 12
        hint: 1 for January through to 12 for December.

      # THE EITHER/OR THE CMS CANNOT EXPRESS
      #
      # src/content.config.ts requires exactly one of: a fixed date, or both
      # "which one" and "which day". Sveltia has no conditional validation, so
      # all three are optional here and the rule is enforced two other ways:
      # the preSave hook in index.html blocks a save that breaks it, and the
      # Astro build refuses the file if one ever gets through.
      - label: Fixed date
        name: fixedDate
        widget: string
        required: false
        hint: >-
          Only for a race on the same calendar date every year, like
          "1 January". Leave empty and use the two boxes below instead if the
          race moves - most do.

      - label: Which one
        name: nth
        widget: select
        required: false
        options: [first, second, third, fourth, last]
        hint: >-
          With the day below, this makes a rule like "last Sunday". Leave both
          empty if you filled in a fixed date.

      - label: Which day
        name: weekday
        widget: select
        required: false
        options: [Monday, Tuesday, Wednesday, Thursday, Friday, Saturday, Sunday]

      - label: Distances
        name: distances
        widget: list
        required: false
        label_singular: Distance
        summary: "{{fields.value}}{{fields.unit}}"
        hint: >-
          One row per distance the event offers. Bridgwater is a half, a 10k
          and a 5k from one start, which is why this is a list - it was two
          separate diary entries until somebody noticed. Add nothing at all for
          a timed event, a 12-hour or a lapped ultra, which has a duration
          rather than a distance.
        fields:
          - label: How far
            name: value
            widget: number
            value_type: float
            step: 0.01
            hint: Just the number - 10 for a 10k, 13.1 for a half marathon.
          - label: Miles or kilometres
            name: unit
            widget: select
            default: km
            options:
              - { label: Kilometres (km), value: km }
              - { label: Miles (mi), value: mi }

      - label: Status
        name: status
        widget: select
        default: active
        options:
          - { label: "Active - happening, show it", value: active }
          - { label: "Renamed - happening under a new name", value: renamed }
          - { label: "Dormant - did not run, may return", value: dormant }
          - { label: "Retired - gone", value: retired }
        hint: >-
          Dormant and Retired both hide the race from the website and both keep
          the entry here. That is the point of them: a deleted race leaves
          nothing to say we checked, so the next trawl through the race reports
          adds it straight back. Say what you found in the Notes box.

      - label: Date
        name: date
        widget: datetime
        required: false
        format: "YYYY-MM-DD"
        date_format: "DD/MM/YYYY"
        time_format: false
        hint: >-
          The date of the next running, if we have one. Fill it in even when it
          is not confirmed - it puts the race in the right place in the order,
          and it will not be shown as a date until the box below is ticked.

      - label: Date confirmed with the organiser
        name: dateConfirmed
        widget: boolean
        required: false
        default: false
        hint: >-
          Only tick this once you have checked the date on the organiser's own
          page. Until it is ticked the website says roughly when the race
          happens - "usually the last Sunday in November" - and never a
          specific day, because somebody turning up a week early is worse than
          a page that admits it does not know. A date that has already passed
          counts as unconfirmed whatever this says.

      - label: Last seen
        name: lastSeen
        widget: datetime
        required: false
        format: "YYYY-MM-DD"
        date_format: "DD/MM/YYYY"
        time_format: false
        hint: >-
          The date we have evidence for, from a club race report. It is what
          the rule was worked out from, not a prediction.

      - label: One of our own races
        name: clubRace
        widget: boolean
        required: false
        default: false

      - label: Counts for the championship
        name: championship
        widget: boolean
        required: false
        default: false

      - label: Entry link
        name: entryUrl
        widget: string
        required: false
        pattern:
          - "^https?://.+"
          - Enter a full web address starting with https://

      - label: Results link
        name: resultsUrl
        widget: string
        required: false
        pattern:
          - "^https?://.+"
          - Enter a full web address starting with https://

      - label: Notes
        name: body
        widget: markdown
        hint: >-
          Anything useful about the race — terrain, where it starts, whether the
          date has moved before.
