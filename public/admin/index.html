<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Keep the editing screen out of search results. Also disallowed in
         /robots.txt — this tag is the belt to that braces, because robots.txt
         only asks crawlers not to fetch the page, it does not stop one that
         already knows the URL from listing it. -->
    <meta name="robots" content="noindex, nofollow" />
    <title>Chard Road Runners — edit the website</title>
  </head>
  <body>
    <!-- Sveltia CMS. The version is pinned on purpose: Sveltia is still
         pre-1.0, so an unpinned URL could change the editing screen under
         a committee member without warning. To update, bump the number
         below, check the release notes, and test a save before telling
         anyone: https://github.com/sveltia/sveltia-cms/releases

         No stylesheet is needed — the styles are bundled in the script.
         Do not add type="module"; the build does not expect it. -->
    <script src="https://unpkg.com/@sveltia/cms@0.205.1/dist/sveltia-cms.js"></script>

    <script>
      // Alt text is required when — and only when — there is a photo to
      // describe.
      //
      // The CMS config cannot say that on its own: Sveltia has no conditional
      // validation, and `required: true` on heroImageAlt would also block the
      // seven posts that have no photo at all, demanding a description for an
      // image that does not exist. So the rule lives here instead.
      //
      // This is deliberately stricter than src/content.config.ts, where
      // heroImageAlt stays optional so the archive keeps building. New and
      // edited content gets alt text; old photo-less posts are left alone.
      // The mismatch is intentional — see the comments in both files.
      (function () {
        if (typeof window.CMS === 'undefined') {
          // eslint-disable-next-line no-console
          console.error('Sveltia CMS did not load, so the alt text check is not active.');
          return;
        }

        // Alt text applies to these three; the diary rule below has its own
        // check. Club news (added 28 October 2026) has the same photo fields
        // as race reports, so the same rule.
        var COLLECTIONS = ['race-reports', 'news', 'races'];

        // Photo paths must start with "./".
        //
        // Both collections keep photos in an images/ folder next to the
        // Markdown, and config.yml sets public_folder to "./images" so the
        // path written is "./images/name.webp". Astro only looks next to the
        // file for a path that starts with "./"; without it, the photo does
        // not appear on the page.
        //
        // Uploading a new photo writes the "./". Choosing one that is already
        // in the media library does not: it writes "images/name.webp". Found
        // 11 October 2026 on the RED Running Devon report, where the gallery
        // copy of a photo showed and the main photo, the same file picked from
        // the library, did not. So this puts the "./" back on save.
        //
        // Deliberately narrow: only a path beginning "images/" is touched.
        // Anything else, right or wrong, is saved exactly as written.
        function withDotSlash(path) {
          return typeof path === 'string' && path.indexOf('images/') === 0
            ? './' + path
            : path;
        }

        // Returns the entry's data with every photo path corrected, or null if
        // nothing needed changing — in which case the save goes through
        // untouched.
        function fixPhotoPaths(data) {
          var changed = false;

          var hero = data.get('heroImage');
          if (withDotSlash(hero) !== hero) {
            data = data.set('heroImage', withDotSlash(hero));
            changed = true;
          }

          // The gallery: a list of { src, alt }. Race reports only.
          var gallery = data.get('images');
          if (gallery && typeof gallery.map === 'function') {
            var fixedGallery = gallery.map(function (item) {
              if (!item || typeof item.get !== 'function') return item;
              var src = item.get('src');
              if (withDotSlash(src) === src) return item;
              changed = true;
              return item.set('src', withDotSlash(src));
            });
            if (changed) data = data.set('images', fixedGallery);
          }

          return changed ? data : null;
        }

        window.CMS.registerEventListener({
          name: 'preSave',
          handler: function (args) {
            var entry = args.entry;
            var collection = entry.get('collection');

            // The race diary's either/or, which the config cannot express.
            //
            // src/content.config.ts requires exactly one of: a fixed date, or
            // both "which one" and "which day". Without this the save
            // succeeds, the build then rejects the file, and the failure lands
            // on the committee member — the exact thing the CMS is here to
            // prevent.
            //
            // It has to come first. Until 11 October 2026 it sat at the end of
            // this handler, below the line that leaves early for anything
            // that is not a race report or a race, so it never ran at all.
            if (collection === 'calendar-events') {
              var fixed = String(entry.getIn(['data', 'fixedDate']) || '').trim();
              var nth = String(entry.getIn(['data', 'nth']) || '').trim();
              var weekday = String(entry.getIn(['data', 'weekday']) || '').trim();
              var hasRule = Boolean(nth && weekday);

              if (Boolean(fixed) === hasRule) {
                throw new Error('saving_failed', {
                  cause: new Error(
                    fixed && hasRule
                      ? 'Use either a fixed date or a rule, not both. Clear the ' +
                        'fixed date if the race moves, or clear "which one" and ' +
                        '"which day" if it is always the same date.'
                      : 'Say when this race happens: either a fixed date like ' +
                        '"1 January", or both "which one" and "which day" to make ' +
                        'a rule like "last Sunday".',
                  ),
                });
              }
              return;
            }

            // Everything below is about photos, in these two collections only.
            if (COLLECTIONS.indexOf(collection) === -1) return;

            var image = entry.getIn(['data', 'heroImage']);
            var alt = entry.getIn(['data', 'heroImageAlt']);

            if (image && !String(alt || '').trim()) {
              // The message only reaches the editor when the error is named
              // `saving_failed` with the real message as its `cause` — that is
              // what the save toolbar looks for. Throwing anything else still
              // blocks the save, but shows an empty dialog. Worth re-checking
              // if the pinned version above is ever bumped.
              throw new Error('saving_failed', {
                cause: new Error(
                  'Add a description for the main photo before saving. ' +
                    'It is read aloud to people using a screen reader, and ' +
                    'shows if the image fails to load.',
                ),
              });
            }

            // Returning the data is how a preSave hook changes what is saved:
            // the pinned version replaces the entry's content with it. Returning
            // nothing saves the entry as it was. Worth re-checking, like the
            // error above, if the pinned version is ever bumped.
            var fixedData = fixPhotoPaths(entry.get('data'));
            if (fixedData) return fixedData;
          },
        });
      })();
    </script>

    <script>
      // The "Photo crop" picker — `widget: crop` in config.yml.
      //
      // Every hero is cut to a wide strip: 2:1 on the page and in the lists,
      // 1200x630 when shared. Which band of the photo survives is chosen per
      // post, from five positions. A dropdown of words made that a guess, so
      // this shows the photo itself cropped at each position, and the chosen
      // one larger, as the page and a share card will show it.
      //
      // It does the cropping exactly as the site does — object-fit: cover and
      // object-position — so what is shown here is what the site shows. The
      // percentages must match CROPS in src/utils/crop.ts.
      //
      // Built with `h` and `createClass`, the globals Sveltia provides for
      // custom fields. No state is kept here: everything is worked out from
      // the props on every render, which is why it follows the photo field as
      // soon as a photo is chosen.
      (function () {
        if (typeof window.CMS === 'undefined' || typeof window.h !== 'function') {
          // eslint-disable-next-line no-console
          console.error('Sveltia CMS did not load, so the photo crop picker is not active.');
          return;
        }
        var h = window.h;

        var PERCENT = { top: 0, upper: 25, middle: 50, lower: 75, bottom: 100 };
        var DEFAULT = 'upper';

        // Where a photo that is already committed can be fetched from. Only
        // used when the CMS has not handed us a link of its own.
        var RAW = 'https://raw.githubusercontent.com/ChardRoadRunners/crr-website/main/src/content/';

        function get(map, key) {
          return map && typeof map.get === 'function' ? map.get(key) : map ? map[key] : undefined;
        }

        // The hero's path as written, e.g. "./images/abc.webp", turned into
        // something an <img> can load. A photo uploaded in this session lives
        // only in the browser until Save, and the CMS lists it among the
        // entry's media files with a temporary link, so look there first.
        function photoUrl(entry, collection) {
          var path = entry && entry.getIn ? entry.getIn(['data', 'heroImage']) : undefined;
          if (!path || typeof path !== 'string') return null;
          if (/^(https?:|blob:|data:)/.test(path)) return path;

          var name = path.split('/').pop();
          var files = get(entry, 'mediaFiles');
          var found = null;
          if (files && typeof files.forEach === 'function') {
            files.forEach(function (file) {
              if (found) return;
              var filePath = String(get(file, 'path') || get(file, 'name') || '');
              if (filePath.split('/').pop() === name) {
                found = get(file, 'url') || get(file, 'displayURL') || null;
              }
            });
          }
          if (found) return found;

          return RAW + collection + '/' + path.replace(/^\.\//, '');
        }

        function crop(url, percent, ratio, style) {
          var box = Object.assign(
            {
              position: 'relative',
              width: '100%',
              aspectRatio: ratio,
              overflow: 'hidden',
              borderRadius: '6px',
              background: 'rgba(127,127,127,0.15)',
            },
            style || {},
          );
          return h(
            'div',
            { style: box },
            h('img', {
              src: url,
              alt: '',
              style: {
                position: 'absolute',
                inset: 0,
                width: '100%',
                height: '100%',
                objectFit: 'cover',
                objectPosition: '50% ' + percent + '%',
                display: 'block',
              },
            }),
          );
        }

        var CropControl = window.createClass({
          render: function () {
            var props = this.props;
            var field = props.field;
            var options = get(field, 'options');
            options = options && options.toJS ? options.toJS() : options || [];
            var value = props.value || DEFAULT;
            var collection = props.entry && props.entry.get ? props.entry.get('collection') : 'race-reports';
            var url = photoUrl(props.entry, collection);

            var choices = h(
              'div',
              {
                role: 'radiogroup',
                'aria-label': 'Photo crop',
                style: {
                  display: 'grid',
                  gridTemplateColumns: 'repeat(auto-fill, minmax(96px, 1fr))',
                  gap: '8px',
                },
              },
              options.map(function (option) {
                var chosen = option.value === value;
                return h(
                  'button',
                  {
                    key: option.value,
                    type: 'button',
                    role: 'radio',
                    'aria-checked': chosen ? 'true' : 'false',
                    onClick: function () {
                      props.onChange(option.value);
                    },
                    style: {
                      font: 'inherit',
                      color: 'inherit',
                      textAlign: 'center',
                      padding: '4px',
                      cursor: 'pointer',
                      background: 'transparent',
                      borderRadius: '9px',
                      border: chosen ? '3px solid currentColor' : '3px solid transparent',
                      outlineOffset: '2px',
                    },
                  },
                  url ? crop(url, PERCENT[option.value], '2 / 1') : null,
                  h(
                    'span',
                    { style: { display: 'block', marginTop: '4px', fontWeight: chosen ? 700 : 400 } },
                    (chosen ? '✓ ' : '') + option.label,
                  ),
                );
              }),
            );

            if (!url) {
              return h(
                'div',
                { id: props.forID, className: props.classNameWrapper },
                h('p', { style: { margin: '0 0 8px', opacity: 0.8 } }, 'Add a main photo above to see how each crop looks.'),
                choices,
              );
            }

            var chosenPercent = PERCENT[value] !== undefined ? PERCENT[value] : PERCENT[DEFAULT];

            return h(
              'div',
              { id: props.forID, className: props.classNameWrapper },
              choices,
              h(
                'div',
                {
                  style: {
                    display: 'grid',
                    gridTemplateColumns: 'repeat(auto-fit, minmax(220px, 1fr))',
                    gap: '12px',
                    marginTop: '16px',
                  },
                },
                h(
                  'figure',
                  { style: { margin: 0 } },
                  crop(url, chosenPercent, '2 / 1'),
                  h('figcaption', { style: { marginTop: '4px', fontSize: '0.9em', opacity: 0.8 } }, 'On the page'),
                ),
                h(
                  'figure',
                  { style: { margin: 0 } },
                  crop(url, chosenPercent, '1200 / 630'),
                  h('figcaption', { style: { marginTop: '4px', fontSize: '0.9em', opacity: 0.8 } }, 'When shared on Facebook or WhatsApp'),
                ),
              ),
            );
          },
        });

        window.CMS.registerFieldType('crop', CropControl);
      })();
    </script>
  </body>
</html>
